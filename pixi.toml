[workspace]
name = "bcl-convert-pipeline"
description = "Snakemake BCL conversion pipeline for Illumina MiSeq i100 / NovaSeqX runs"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64"]

# NOTE: on HPC3 this pipeline runs via Singularity + slurm (profiles/hpc3), not DRAGEN.
#
# This file is ALSO the image's dependency spec: the bcl_convert container copies
# pixi.toml + pixi.lock into its build context and runs `pixi install --locked`, so the
# image can never disagree with what a host pixi env would resolve. After changing a
# version here, run `pixi lock` and copy both files to the container repo, or the image
# keeps building the old set. See README > Container image.
#
# Two dependencies are NOT managed by pixi and must be present on the system:
#   1. Singularity, via `module load singularity` (see run_hpc3_container.sh). On the
#      container path this is the only host requirement.
#   2. Optional custom flexbar build referenced by `flexbar_bin` in snakemake_config.yaml.
#      A bioconda flexbar is provided below; point `flexbar_bin` at it to drop the custom build.

[dependencies]
python = "3.12.*"
snakemake-minimal = ">=9.14,<9.15"
snakemake-executor-plugin-slurm = "*"
pandas = "2.3.*"
numpy = "2.3.*"
openpyxl = "3.1.*"
matplotlib-base = "3.10.*"
pillow = "12.*"
pyyaml = "6.*"
reportlab = "4.*"

# Bioinformatics CLIs invoked by the workflow (bioconda)
fastqc = "0.12.*"
fastp = "0.24.*"
flexbar = "3.5.*"
seqtk = "1.5.*"
fqtk = "0.3.*"
seqkit = ">=2.13.0,<3"
pigz = ">=2.8,<3"

# `dot` for the rulegraph/dag tasks below
graphviz = ">=12,<15"

# Applied on every `pixi run` / `pixi shell`.
[activation]
# Source .env so the 4 required secrets are always in the environment — no
# manual `set -a; source .env; set +a` before snakemake. See scripts/load_dotenv.sh.
scripts = ["scripts/load_dotenv.sh"]

[activation.env]
# Snakemake reads SNAKEMAKE_PROFILE, so profiles/hpc3 (slurm executor + Singularity)
# applies to EVERY invocation (even a bare `pixi run snakemake -n`) without passing
# --profile. See profiles/hpc3/config.yaml.
SNAKEMAKE_PROFILE = "profiles/hpc3"

[tasks]
# Tasks rely on SNAKEMAKE_PROFILE (set above) instead of a repeated --profile flag.
# These are the HOST path; the container path is `bash run_hpc3_container.sh` and
# needs no pixi at all. Both run the same DAG with the same profile.
# Full workflow
all = "bash run_hpc3.sh"
# Preview what would run
dry-run = "bash run_hpc3.sh --dryrun"
# Same, but with the Snakemake driver inside the container (no host env needed)
container = "bash run_hpc3_container.sh"
container-dry-run = "bash run_hpc3_container.sh --dryrun"
# Run one command in the image: `pixi run container-exec bcl-convert --version`. This is
# the no-pixi form of every task below that needs python or snakemake -- `validate`
# becomes `bash scripts/container_exec.sh python run_validation.py`, and so on.
container-exec = "bash scripts/container_exec.sh"
# One-time per-run setup: project config + samplesheet (copy/prefill). Idempotent.
# Plain bash, so `bash scripts/init_run.sh` works with no pixi and no container.
init = "bash scripts/init_run.sh"
# Validate the metadata workbook before a real run
validate = "python run_validation.py"
# BCL conversion for a single lane, e.g. `pixi run convert output/lane1`
convert = "bash run_hpc3.sh"
# Rule/dependency graphs
rulegraph = "snakemake --rulegraph | dot -Tpng > rulegraph.png"
dag = "snakemake --dag | dot -Tpdf > dag.pdf"
