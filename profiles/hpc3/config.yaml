snakefile: Snakefile
configfile: snakemake_config.yaml
executor: slurm
use-singularity: true
singularity-args: >-
  --bind /dfs9
  --bind /tmp/bcl-convert-logs:/var/log/bcl-convert
  --env PATH=/app/.pixi/envs/default/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
retries: 3
# Must be >= the largest `threads:` in the Snakefile (32, flexbar_per_config).
# Snakemake silently downscales a rule's threads to this value.
cores: 32
jobs: 32
keep-going: True
default-resources:
  # Not `free`: that partition gets preempted mid-conversion.
  slurm_partition: standard
  # Your slurm account. Check yours with `sacctmgr -nP show assoc user=$USER format=Account`.
  # run_hpc3.sh overrides this when $SLURM_ACCOUNT is set, so you can export that
  # instead of editing this file.
  slurm_account: sbsandme_lab
  mem_mb: 8000
  runtime: 60

# No serial_operation cap here: that exists in profiles/default to serialize
# DRAGEN-FPGA-bound jobs on the dragen server. hpc3 runs software bcl-convert
# via singularity/SLURM (no FPGA), and lanes are already forced serial by the
# bcl_convert DAG chain (get_prev_bcl_done), so the cap would only throttle
# bcl_convert_rc/project_link/flexbar_project_link against each other for no
# hardware reason.
resources:
  - nextcloud_api=3
  - precision_ssh=3

# dfs9 (JBOD/NFS) can take a while to make outputs visible after a job exits.
latency-wait: 120

# Only mtime triggers a re-run, so an unrelated Snakefile edit doesn't
# re-run bcl-convert.
rerun-triggers: mtime
