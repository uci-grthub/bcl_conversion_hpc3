snakefile: Snakefile
configfile: snakemake_config.yaml
executor: slurm

# No use-singularity / singularity-args here. Those only ever applied to rules
# declaring a `container:` directive, and none do — the setting was inert. The
# container is entered one level up instead: run_hpc3_container.sh runs this
# whole Snakemake process inside the image, and every job it spawns re-enters
# the same image through the generated .container/bin/python shim. Re-adding
# them would wrap already-containerized rules in a second, nested container.
#
# The two settings that make that spawn work are NOT here either; the launcher
# passes them, because both need absolute paths that depend on where the repo
# is checked out:
#   --shared-fs-usage (omitting software-deployment)
#   --precommand "export PATH=<repo>/.container/bin:..."

retries: 3
# Must be >= the largest `threads:` in the Snakefile (32, flexbar_per_config).
# Snakemake silently downscales a rule's threads to this value.
cores: 32
jobs: 32
keep-going: True
default-resources:
  # Not `free`: that partition gets preempted mid-conversion.
  slurm_partition: standard
  # No slurm_account here on purpose. It is per-operator, and a value committed
  # to a tracked file is wrong for everyone but its author. Both launchers pass
  # it from $SLURM_ACCOUNT (set it once in ~/.env) and refuse to submit when it
  # is unset -- see the comment in run_hpc3.sh.
  #
  # Leaving it merely unset here is not an option: the slurm executor plugin's
  # account auto-guess is broken on this cluster (`sacct: invalid option --
  # '1'`), so it silently submits with no --account, and slurm then charges the
  # user's DEFAULT association -- typically their personal account, not the
  # lab's. Hence the hard check in the launchers.
  mem_mb: 8000
  runtime: 60

# No serial_operation cap here: that exists in profiles/default to serialize
# DRAGEN-FPGA-bound jobs on the dragen server. hpc3 runs software bcl-convert
# via singularity/SLURM (no FPGA), and lanes are already forced serial by the
# bcl_convert DAG chain (get_prev_bcl_done), so the cap would only throttle
# bcl_convert_rc/project_link/flexbar_project_link against each other for no
# hardware reason.
resources:
  - nextcloud_api=3
  - precision_ssh=3

# dfs9 (JBOD/NFS) can take a while to make outputs visible after a job exits.
latency-wait: 120

# Only mtime triggers a re-run, so an unrelated Snakefile edit doesn't
# re-run bcl-convert.
rerun-triggers: mtime
