# Snakemake configuration, shared by both halves of the pipeline.
#
# The conversion workflow (Snakefile, HPC3) reads only the conversion keys; it
# has no Nextcloud or email rules at all. The delivery workflow
# (Snakefile.delivery, dragen server) reads this file, then
# snakemake_config_project.yaml, then snakemake_config_delivery.yaml, and gets
# its Nextcloud/email/rsync settings from the last of those. See docs/handoff.md.

# The container image the whole workflow runs inside — bcl-convert plus every
# other tool, and the Snakemake driver itself. run_hpc3_container.sh reads this
# key (override for one run with `export BCL_CONVERT_SIF=...`); no rule reads it.
# The lab copy is readable by group ucightf: if it reports "No such file or
# directory", check `id | grep ucightf`. See README > Container image to rebuild.
container_sif: "/dfs9/ucightf-lab/containers/bcl_convert_docker_v2.sif"

# Delivery-side only. There is no enable_nextcloud key any more: the delivery
# workflow hard-fails without Nextcloud credentials rather than producing
# empty-link YAMLs that later look up-to-date.
send_emails: false
num_reads: 2
library_name: ""
start_s: 1
lanes: [1,2,3,4,5,6,7,8]
fastp_threads: 4

# Empty = use the flexbar that pixi installs (bioconda 3.5). Set to an absolute path
# (or $FLEXBAR_BIN) only to use a custom speedup build, e.g.
# /path/to/build_parasail/src/flexbar
flexbar_bin: ""
# Number of leading bases (e.g. a UMI) before the inline barcode in R1. The
# barcode FASTA is built as "<this many N's><barcode>" and matched at the read
# start (LTAIL). 0 = barcode at R1 position 1 (KY26SPI inline libraries). Set to
# 5 for PAREseq-style U5I6 libraries.
flexbar_barcode_leader_n: 5
# If no sample exceeds this many assigned reads after the forward-orientation
# pass, flexbar retries with the reverse-complement indices.
flexbar_retry_min_reads: 1000000
metadata: ""
data_dir: ""
tiles: ""
# Set these per run in snakemake_config_project.yaml (see SOP). Left blank in the
# base config so a fresh clone never silently emails the previous operator, and
# so it never rsyncs/shares unless a project explicitly enables it.
email_sender: ""
email_recipient: ""
email_cc: ""
nextcloud_dir_name: "dragenshare"
nextcloud_dir_path: "nextcloud"
external_drive_path: ""

# Fast local NVMe scratch for bcl-convert output (avoids writing directly to slow storage).
# bcl-convert writes FASTQs here first; files are moved to the final output/ path after conversion.
# Set to "" or omit to write directly to output/.
scratch_dir: ""

use_ancient: true  # Whether to use ancient files for bcl-convert outputs if available (default: true). Set to false to always re-run bcl-convert.

# Force CreateFastqForIndexReads=1 in every generated SampleSheet so DRAGEN emits index
# reads as FASTQs (i.e. no index-based demultiplexing). Default: false.
no_demux: false

# Which configs (lanes) should keep Undetermined reads? Others will have them deleted.
# Default is empty list (delete all Undetermined reads).
# Example: keep_undetermined_configs: ["lane1", "lane3"]
# Note: Undetermined reads are automatically kept if flexbar_barcodes_{config_id}.txt exists.
keep_undetermined_configs: []

# Which configs (lanes) should treat Undetermined reads as a normal sample?
# For each listed lane the Undetermined FASTQs are kept, renamed into the lane's
# first project directory (output/{config_id}/{project}/), and flow through the
# standard pipeline: fastp QC, read counts, md5sums, nextcloud links, and the
# per-order HTML report. Membership in this list is the on/off switch per lane.
# Configs listed here are automatically added to keep_undetermined_configs.
# Example: report_undetermined_configs: ["lane1"]
report_undetermined_configs: []

# Order IDs whose projects should be excluded from rule all (e.g. skip processing for a specific order).
# Also excludes the order-level reports and emails for those order IDs.
# Example: exclude_order_ids: ["0326I-13", "0326I-14"]
exclude_order_ids: []

# Report plot composition settings
plots_total_width: 900  # Total width in pixels for composed plots (default: 900)
plots_quality: 35       # JPEG quality for composed plots, 1-95 (default: 35, lower = smaller file)
bcl_convert_order: []

# bcl-convert threads. These three are passed straight through to
# --bcl-num-{conversion,compression,decompression}-threads. Their sum must stay
# within the bcl_convert rule's `threads:` (24) — that is what slurm allocates,
# and bcl-convert will happily oversubscribe past it. 8/8/8 is the combination
# the benchmarks/ timings were measured with; raise the rule's `threads:` too
# before raising these.
bcl_conversion_threads: 8
bcl_compression_threads: 8
bcl_decompression_threads: 8

# How many tiles bcl-convert pipelines at once (--bcl-num-parallel-tiles).
# bcl_conversion_threads is PER TILE, not a total: at 2 parallel tiles bcl-convert
# logs "Parallel Tiles: 2. Threads Per Tile: 8" and runs 16 conversion threads. So
# this multiplies both CPU and memory — conversion threads and the ~23GB/tile RSS
# both scale with it. Keep (bcl_conversion_threads * bcl_parallel_tiles) + compression
# + decompression within the rules' `threads:`, and raise mem_mb to match.
# 1 was too slow to finish a 25B lane inside the old 2 h ceiling.
bcl_parallel_tiles: 2
